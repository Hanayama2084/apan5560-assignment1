[project]
name = "sps-genai"
version = "0.1.0"
description = "Applied Generative AI - FastAPI service for bigram text generation, word embeddings and CIFAR10 image classification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "en-core-web-md",
    "fastapi[standard]>=0.141.1",
    "spacy>=3.8.16",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[tool.uv.sources]
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }
# On Linux (inside Docker) install the CPU-only PyTorch build, which is much
# smaller than the default build with NVIDIA GPU libraries. macOS uses PyPI.
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
